<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>TrainLine - Tu Viaje Comienza Aquí</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&amp;display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <link rel="stylesheet" href="static/styles/inicioAplicación.css" />
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      --main-dark-blue: #0A192F;
      --primary-accent: #3b82f6;
      --primary-accent-hover: #2563eb;
      --text-light: #e2e8f0;
      --text-secondary: #94a3b8;
    }

    .bg-image-container {
      background-image: url('../static/img/tren_pantalla_inicio.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .overlay {
      background-color: rgba(10, 25, 47, 0.7);
    }
  </style>
</head>

<body class="bg-[var(--main-dark-blue)] text-[var(--text-light)]">
  <div class="relative flex min-h-screen w-full flex-col bg-image-container">
    <div class="absolute inset-0 overlay z-0"></div>
    <header class="relative z-10 p-4 sm:p-6 lg:p-8">
      <nav aria-label="Navegación principal" class="flex items-center justify-between">
        <a aria-label="Página de inicio de TrainLine" class="flex items-center gap-2" href="#">
          <span class="material-symbols-outlined text-3xl text-white">train</span>
          <span class="text-xl font-bold text-white">TrainLine</span>
        </a>
      </nav>
    </header>
    <main class="relative z-10 flex flex-grow flex-col items-center justify-center text-center p-4">
      <div class="max-w-2xl">
        <h1 class="text-4xl font-extrabold tracking-tight text-white sm:text-5xl md:text-6xl">Tu viaje comienza aquí
        </h1>
        <p class="mt-4 text-lg text-[var(--text-secondary)] sm:mt-6 sm:text-xl">Encuentra horarios de trenes, reserva
          billetes y gestiona todos tus viajes en un solo lugar.</p>
        <div class="mt-8 sm:mt-10">
          <a class="inline-flex min-w-[120px] cursor-pointer items-center justify-center rounded-lg bg-[var(--primary-accent)] px-8 py-3 text-base font-bold text-white shadow-lg transition-colors hover:bg-[var(--primary-accent-hover)] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--primary-accent)]"
            href="./loginUsuario.html">
            Iniciar Sesión
          </a>
        </div>
      </div>
    </main>
    <footer class="relative z-10 p-4 text-center">
      <p class="text-sm text-[var(--text-secondary)]">© 2024 TrainLine. Todos los derechos reservados.</p>
    </footer>
  </div>

</body>

</html>
