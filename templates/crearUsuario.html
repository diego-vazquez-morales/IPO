<!DOCTYPE html>

<html class="light" lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Crea tu Cuenta en TrainLife</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link href="../static/styles/crearUsuario.css" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec37",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102213",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark font-display text-neutral-800 dark:text-neutral-200">
    <div class="relative flex min-h-screen w-full flex-col items-center justify-center p-4 sm:p-6 md:p-8">
        <div class="w-full max-w-lg space-y-8">
            <div class="text-center">
                <h1 class="text-3xl font-black tracking-tighter text-[#0d1b10] dark:text-white sm:text-4xl">Crea tu
                    Cuenta en TrainApp</h1>
            </div>
            <div class="space-y-6">
                <div class="space-y-4">
                    <label class="flex flex-col">
                        <p class="pb-2 text-base font-medium text-[#0d1b10] dark:text-neutral-300">Nombre</p>
                        <input
                            class="form-input h-14 w-full resize-none overflow-hidden rounded-lg border border-[#cfe7d3] bg-[#f8fcf9] p-[15px] text-base font-normal leading-normal text-[#0d1b10] placeholder:text-neutral-400 focus:border-primary/50 focus:outline-0 focus:ring-2 focus:ring-primary/20 dark:border-neutral-700 dark:bg-neutral-800 dark:text-white dark:placeholder:text-neutral-500 dark:focus:border-primary/50"
                            placeholder="Ingresa tu nombre" type="text" />
                    </label>
                    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                        <label class="flex flex-col">
                            <p class="pb-2 text-base font-medium text-[#0d1b10] dark:text-neutral-300">Primer Apellido
                            </p>
                            <input
                                class="form-input h-14 w-full resize-none overflow-hidden rounded-lg border border-[#cfe7d3] bg-[#f8fcf9] p-[15px] text-base font-normal leading-normal text-[#0d1b10] placeholder:text-neutral-400 focus:border-primary/50 focus:outline-0 focus:ring-2 focus:ring-primary/20 dark:border-neutral-700 dark:bg-neutral-800 dark:text-white dark:placeholder:text-neutral-500 dark:focus:border-primary/50"
                                placeholder="Ingresa tu apellido" type="text" />
                        </label>
                        <label class="flex flex-col">
                            <p class="pb-2 text-base font-medium text-[#0d1b10] dark:text-neutral-300">Segundo Apellido
                            </p>
                            <input
                                class="form-input h-14 w-full resize-none overflow-hidden rounded-lg border border-[#cfe7d3] bg-[#f8fcf9] p-[15px] text-base font-normal leading-normal text-[#0d1b10] placeholder:text-neutral-400 focus:border-primary/50 focus:outline-0 focus:ring-2 focus:ring-primary/20 dark:border-neutral-700 dark:bg-neutral-800 dark:text-white dark:placeholder:text-neutral-500 dark:focus:border-primary/50"
                                placeholder="Ingresa tu apellido" type="text" />
                        </label>
                    </div>
                    <label class="flex flex-col">
                        <p class="pb-2 text-base font-medium text-[#0d1b10] dark:text-neutral-300">Número de Teléfono
                        </p>
                        <input
                            class="form-input h-14 w-full resize-none overflow-hidden rounded-lg border border-[#cfe7d3] bg-[#f8fcf9] p-[15px] text-base font-normal leading-normal text-[#0d1b10] placeholder:text-neutral-400 focus:border-primary/50 focus:outline-0 focus:ring-2 focus:ring-primary/20 dark:border-neutral-700 dark:bg-neutral-800 dark:text-white dark:placeholder:text-neutral-500 dark:focus:border-primary/50"
                            placeholder="Ingresa tu número de teléfono" type="tel" />
                    </label>
                    <label class="flex flex-col">
                        <p class="pb-2 text-base font-medium text-[#0d1b10] dark:text-neutral-300">Correo Electrónico
                        </p>
                        <input
                            class="form-input h-14 w-full resize-none overflow-hidden rounded-lg border border-[#cfe7d3] bg-[#f8fcf9] p-[15px] text-base font-normal leading-normal text-[#0d1b10] placeholder:text-neutral-400 focus:border-primary/50 focus:outline-0 focus:ring-2 focus:ring-primary/20 dark:border-neutral-700 dark:bg-neutral-800 dark:text-white dark:placeholder:text-neutral-500 dark:focus:border-primary/50"
                            placeholder="tu.correo@ejemplo.com" type="email" />
                    </label>
                    <div class="relative">
                        <label class="flex flex-col">
                            <p class="pb-2 text-base font-medium text-[#0d1b10] dark:text-neutral-300">Contraseña</p>
                            <input
                                class="form-input h-14 w-full resize-none overflow-hidden rounded-lg border border-[#cfe7d3] bg-[#f8fcf9] p-[15px] pr-12 text-base font-normal leading-normal text-[#0d1b10] placeholder:text-neutral-400 focus:border-primary/50 focus:outline-0 focus:ring-2 focus:ring-primary/20 dark:border-neutral-700 dark:bg-neutral-800 dark:text-white dark:placeholder:text-neutral-500 dark:focus:border-primary/50"
                                placeholder="Crea una contraseña segura" type="password" />
                            <button class="absolute right-3 top-[46px] text-neutral-500 dark:text-neutral-400">
                                <span class="material-symbols-outlined">visibility_off</span>
                            </button>
                        </label>
                    </div>
                    <div class="relative">
                        <label class="flex flex-col">
                            <p class="pb-2 text-base font-medium text-[#0d1b10] dark:text-neutral-300">Confirmar
                                Contraseña</p>
                            <input
                                class="form-input h-14 w-full resize-none overflow-hidden rounded-lg border border-[#cfe7d3] bg-[#f8fcf9] p-[15px] pr-12 text-base font-normal leading-normal text-[#0d1b10] placeholder:text-neutral-400 focus:border-primary/50 focus:outline-0 focus:ring-2 focus:ring-primary/20 dark:border-neutral-700 dark:bg-neutral-800 dark:text-white dark:placeholder:text-neutral-500 dark:focus:border-primary/50"
                                placeholder="Confirma tu contraseña" type="password" />
                            <button class="absolute right-3 top-[46px] text-neutral-500 dark:text-neutral-400">
                                <span class="material-symbols-outlined">visibility_off</span>
                            </button>
                        </label>
                    </div>
                </div>
                <div class="flex items-start space-x-3">
                    <input
                        class="form-checkbox mt-1 h-5 w-5 rounded border-neutral-300 text-primary focus:ring-primary/50 dark:border-neutral-600 dark:bg-neutral-800 dark:checked:bg-primary"
                        id="terms-checkbox" type="checkbox" />
                    <label class="text-sm text-neutral-600 dark:text-neutral-400" for="terms-checkbox">
                        Acepto los <a
                            class="font-medium text-primary/80 hover:text-primary dark:text-primary/90 dark:hover:text-primary"
                            href="#">Términos y Condiciones</a> y la <a
                            class="font-medium text-primary/80 hover:text-primary dark:text-primary/90 dark:hover:text-primary"
                            href="#">Política de Privacidad</a>.
                    </label>
                </div>
                <button
                    class="flex h-14 w-full items-center justify-center rounded-xl bg-primary px-4 py-2 text-base font-bold text-black transition-colors hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:ring-offset-2 dark:focus:ring-offset-background-dark">Crear
                    Cuenta</button>
            </div>
            <div class="text-center">
                <p class="text-sm text-neutral-600 dark:text-neutral-400">
                    ¿Ya tienes una cuenta? <a
                        class="font-medium text-primary/80 hover:text-primary dark:text-primary/90 dark:hover:text-primary"
                        href="./loginUsuario.html">Inicia Sesión</a>
                </p>
            </div>
        </div>
    </div>
</body>

</html>
